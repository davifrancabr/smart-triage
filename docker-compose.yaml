services:
  mysql:
    image: mysql:8.0
    container_name: smart-triage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smart_triage
      MYSQL_USER: triage
      MYSQL_PASSWORD: triage123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
